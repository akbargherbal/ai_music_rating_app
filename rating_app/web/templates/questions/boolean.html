<div class="question-block" data-key="{{ c.key }}">
  <div class="q">{{ c.label }}{% if c.required %}<span style="color:var(--bad)"> *</span>{% endif %}</div>
  {% if c.help %}<div class="help">{{ c.help }}</div>{% endif %}
  <div class="seg">
    <label>
      <input type="radio" name="{{ c.key }}" value="true" {% if rec.get(c.key)|string == 'true' %}checked{% endif %}>
      <span>Yes</span>
    </label>
    <label>
      <input type="radio" name="{{ c.key }}" value="false" {% if rec.get(c.key)|string == 'false' %}checked{% endif %}>
      <span>No</span>
    </label>
  </div>
</div>
